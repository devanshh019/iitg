services:
  postgres:
    image: postgres:16-alpine
    container_name: hackos_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hackos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: hackos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hackos
      - SECRET_KEY=hackos_super_secret_jwt_hmac_signing_key_change_in_prod_min_32_bytes_long!
      - PII_ENCRYPTION_KEY=OFIYEpprvIcFxcPHnPeEDp_gfqEpEqdTHW7DgPCl8as=
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - ENVIRONMENT=production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    container_name: hackos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
