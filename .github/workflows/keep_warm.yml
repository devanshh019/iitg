name: Keep Warm Ping

on:
  schedule:
    # Ping every 14 minutes to prevent free-tier instances (Render) from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Backend Health
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL || 'https://hackos-backend.onrender.com' }}/health"
          echo "Pinging ${TARGET_URL}..."
          curl -s -f -m 15 "${TARGET_URL}" || echo "Backend waking up..."
