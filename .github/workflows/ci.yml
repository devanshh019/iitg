name: HACKOS CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: hackos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff mypy

      - name: Lint with ruff
        run: |
          ruff check backend/app

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/hackos_test
        run: |
          cd backend
          alembic upgrade head

      - name: Execute pytest test suite with coverage
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/hackos_test
          PII_ENCRYPTION_KEY: OFIYEpprvIcFxcPHnPeEDp_gfqEpEqdTHW7DgPCl8as=
          SECRET_KEY: test_secret_key_minimum_32_bytes_long!
        run: |
          PYTHONPATH=. pytest -v --cov=backend/app --cov-report=term

  frontend-build:
    name: Frontend Type-Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Type-check and build Vite bundle
        run: |
          cd frontend
          npm run build
